<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Files</title>
</head>

<body>

    <div class="container">

        <h1>Multipart File Upload</h1>

        <form
            action="/upload_file"
            method="POST"
            enctype="multipart/form-data">

            <label>Select file</label>

            <input
                id="file"
                name="file"
                type="file">

            <button type="submit">
                Upload
            </button>

        </form>

    </div>

    <hr>

    <div class="container">

        <h1>Multipart File Private Upload</h1>

        <form
            action="/upload_file_private"
            method="POST"
            enctype="multipart/form-data">

            <label>Select file</label>

            <input
                id="file"
                name="file"
                type="file">

            <button type="submit">
                Upload
            </button>

        </form>

    </div>

</body>
</html>
